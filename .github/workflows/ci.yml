name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: test
        run: npm test

      # Duplicate IDs, dangling Marks, an encounter naming a body that is not there. Also
      # runs as a test, so this is for the readable output rather than for the gate.
      - name: content check
        run: npm run content:check

      # Warn-only until the demo is art-complete. Phase 9 adds --strict.
      - name: art check
        run: npm run art:check

      # Small on purpose. The point is that the harness still plays every fight to a
      # conclusion; the balance passes are run by hand in phase 6.
      - name: sim smoke
        run: npm run sim -- --runs 110 --seed 0 --no-cards

      - name: build
        run: npm run build
